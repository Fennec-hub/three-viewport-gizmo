name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26.7.0'
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACDMRT "origin/$BASE_REF...$SOURCE_SHA" > /tmp/changed-files
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACDMRT -r HEAD > /tmp/changed-files
          fi
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" \
            --ref "$REF_NAME" \
            --sha "$SOURCE_SHA" \
            --package-version "$(node -p "require('./package.json').version")" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files

  quality:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.14.0'
            npm: '11.17.0'
          - node: '26.7.0'
            npm: '12.0.2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ matrix.npm }}
      - run: npm run quality
      - name: Require a Version Plan for release-affecting changes
        if: matrix.node == '26.7.0' && needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            npx nx release plan:check --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "::error::Cannot validate Version Plans without a previous push SHA"
              exit 1
            fi
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD || {
              echo "::error::Cannot validate Version Plans across a force-push"
              exit 1
            }
            npx nx release plan:check --base="$BEFORE_SHA" --head=HEAD
          else
            npx nx release plan:check --base=HEAD~1 --head=HEAD
          fi

  candidate:
    needs: [preflight, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26.7.0'
      - run: npm run build
      - name: Freeze the exact npm candidate
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir candidate
          npm pack --ignore-scripts --json --pack-destination candidate > /tmp/pack.json
          node <<'NODE'
          const { copyFileSync, readFileSync, writeFileSync } = require('node:fs');
          const result = JSON.parse(readFileSync('/tmp/pack.json', 'utf8'));
          const pack = Array.isArray(result) ? result[0] : result.name ? result : Object.values(result)[0];
          const manifest = {
            name: pack.name,
            version: pack.version,
            filename: pack.filename,
            integrity: pack.integrity,
            commit: process.env.SOURCE_COMMIT,
            runId: process.env.WORKFLOW_RUN,
          };
          writeFileSync('candidate/manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          copyFileSync('scripts/verify-release-attestations.mjs', 'candidate/verify-release-attestations.mjs');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 14

  consumer:
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
      - run: npm install --global npm@12.0.2
      - name: Install and load the frozen tarball
        run: |
          set -euo pipefail
          root="$PWD"
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$root/candidate/$(node -p "require('$root/candidate/manifest.json').filename")" three@0.184.0
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { access, readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { ViewportGizmo } from '@taulabs/three-viewport-gizmo';
          const packageRoot = resolve('node_modules/@taulabs/three-viewport-gizmo');
          const manifest = JSON.parse(await readFile(resolve(packageRoot, 'package.json'), 'utf8'));
          assert.equal(manifest.name, '@taulabs/three-viewport-gizmo');
          assert.equal(typeof ViewportGizmo, 'function');
          await access(resolve(packageRoot, manifest.types));
          NODE
          node -e "const { ViewportGizmo } = require('@taulabs/three-viewport-gizmo'); if (typeof ViewportGizmo !== 'function') process.exit(1)"

  publish:
    if: needs.preflight.outputs.npm-publish == 'true'
    needs: [preflight, candidate, consumer]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      existed: ${{ steps.publish.outputs.existed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.2
      - name: Publish the exact candidate with trusted provenance
        id: publish
        run: |
          set -euo pipefail
          name=$(node -p "require('./candidate/manifest.json').name")
          version=$(node -p "require('./candidate/manifest.json').version")
          filename=$(node -p "require('./candidate/manifest.json').filename")
          integrity=$(node -p "require('./candidate/manifest.json').integrity")
          existing=$(npm view "$name@$version" dist.integrity 2>/dev/null || true)
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$integrity" ]] || {
              echo "::error::$name@$version exists with different integrity"
              exit 1
            }
            echo "$name@$version already has the candidate integrity"
            echo "existed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish "./candidate/$filename" --access public --provenance --ignore-scripts
          echo "existed=false" >> "$GITHUB_OUTPUT"

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, candidate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source-commit: ${{ steps.attestations.outputs.source_commit }}
      workflow-run: ${{ steps.attestations.outputs.workflow_run }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.2
      - name: Verify registry consumers and provenance
        id: attestations
        env:
          PACKAGE_EXISTED: ${{ needs.publish.outputs.existed }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./candidate/manifest.json').name")
          version=$(node -p "require('./candidate/manifest.json').version")
          integrity=$(node -p "require('./candidate/manifest.json').integrity")
          for attempt in {1..20}; do
            existing=$(npm view "$name@$version" dist.integrity 2>/dev/null || true)
            [[ "$existing" == "$integrity" ]] && break
            [[ "$attempt" == 20 ]] && {
              echo "::error::Registry did not serve the candidate integrity"
              exit 1
            }
            sleep 15
          done
          root="$PWD"
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$name@$version" three@0.184.0
          node --input-type=module -e "import { ViewportGizmo } from '$name'; if (typeof ViewportGizmo !== 'function') process.exit(1)"
          node -e "const { ViewportGizmo } = require('$name'); if (typeof ViewportGizmo !== 'function') process.exit(1)"
          npm audit signatures --json --include-attestations > /tmp/npm-audit-signatures.json
          cd "$root"
          expected=()
          if [[ "$PACKAGE_EXISTED" != true ]]; then
            expected=("$SOURCE_COMMIT" "$WORKFLOW_RUN")
          fi
          node candidate/verify-release-attestations.mjs \
            /tmp/npm-audit-signatures.json \
            candidate/manifest.json \
            "${expected[@]}"

  registry-release:
    if: always() && needs.registry-verify.result == 'success'
    needs: [preflight, registry-verify]
    runs-on: ubuntu-24.04
    permissions: {}
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Mint repository-scoped tau-release-bot token
        id: release-bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create the verified tag and GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.registry-verify.outputs.source-commit }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if tag_object=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            target=$(gh api "repos/$REPOSITORY/git/tags/$tag_object" --jq .object.sha)
            [[ "$target" == "$SOURCE_COMMIT" ]] || {
              echo "::error::$tag points at $target, not $SOURCE_COMMIT"
              exit 1
            }
          else
            tag_object=$(gh api --method POST "repos/$REPOSITORY/git/tags" \
              -f tag="$tag" -f message="three-viewport-gizmo $tag" \
              -f object="$SOURCE_COMMIT" -f type=commit --jq .sha)
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$tag_object" >/dev/null
          fi
          gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$REPOSITORY" --verify-tag --generate-notes

  ci-gate:
    if: always()
    needs: [preflight, quality, candidate, consumer, publish, registry-verify, registry-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert required job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = ['preflight', 'quality', 'candidate', 'consumer'];
          if (needs.preflight?.result === 'success' && process.env.PUBLISH === 'true') {
            required.push('publish', 'registry-verify', 'registry-release');
          }
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          NODE
